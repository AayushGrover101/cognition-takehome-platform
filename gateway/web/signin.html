<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Internal tools</title><link rel="stylesheet" href="/web/base.css"></head>
<body><div class="split">
<section class="side">
<a class="brand" href="/"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="6" fill="#111"/><path d="M7 15.5V6.5M11 15.5V9.5M15 15.5V12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>Internal tools</a>
<div class="form-wrap"><form method="post" action="/signin">
<h1>Sign in</h1>
<p class="sub">{{sub}}</p>
<input type="hidden" name="next" value="{{next}}">
<label class="label" for="user">Account</label>
<div class="select"><select id="user" name="user" required>
<option value="" disabled{{none_selected}}>Choose an account</option>
{{options}}
</select><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<button class="btn primary block" type="submit">Continue</button>
<p class="fine">Demo sign-in. In production this is your company single sign-on, and your role comes from it.</p>
</form></div>
<p class="legal">Access is logged and reviewed.</p>
</section>
<aside class="panel">
<p class="quote">Every internal tool, <span>one governed gateway.</span></p>
<div class="points"><span>Single sign-on</span><span>Role-based access</span><span>Reviewed permissions</span><span>Audit trail</span></div>
</aside>
</div></body></html>
