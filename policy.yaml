# Who exists and which role each person has. Stand-in for the company identity provider.
# Role id: job title. Each role matches a real team and the tools that team uses.
roles:
  kyc_analyst: KYC Analyst                  # Compliance: works the KYC queue, escalates hard cases
  compliance_officer: Compliance Officer    # Compliance: approves/rejects cases, may see full tax IDs
  support_agent: Support Agent              # Support: handles customer refund requests
  support_lead: Support Lead                # Support: declines refunds, posts customer updates
  product_manager: Product Manager          # Product: watches feature-flag rollouts
  engineer: Software Engineer               # Engineering: turns flags on/off, changes rollouts
  platform_engineer: Platform Engineer      # Owns the gateway and connectors, reviews app.yaml

users:
  - {id: priya,  name: Priya Shah,  role: kyc_analyst}
  - {id: dana,   name: Dana Ortiz,  role: compliance_officer}
  - {id: marcus, name: Marcus Lee,  role: support_agent}
  - {id: lena,   name: Lena Novak,  role: support_lead}
  - {id: omar,   name: Omar Haddad, role: product_manager}
  - {id: alex,   name: Alex Chen,   role: engineer}
  - {id: sam,    name: Sam Kim,     role: platform_engineer}

# Connector groups (as in Power Platform DLP). Business: company systems and data. Non-business: outside services.
# Blocked: no app may use it. An app can't combine Business and Non-business connectors. A connector missing here counts as Blocked.
connectors:
  kyc: business
  refunds: business
  flags: business
  slack: non-business
  gdrive: blocked
