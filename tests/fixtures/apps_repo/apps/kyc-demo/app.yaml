title: KYC demo
description: Review queue for pending KYC cases.
access: [kyc_analyst, compliance_officer]
connectors: [kyc]
roles:
  kyc_analyst:
    tools: [kyc.list_cases, kyc.get_case, kyc.escalate_case]
  compliance_officer:
    tools: [kyc.*]
audit_reads: [kyc.get_case_full]     # reads are off unless listed; writes are always audited
audit_viewers: [compliance_officer]
